<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>یاسولیک | ماجراجویی سرعتی</title>
<style>
:root{--glass:rgba(13,24,56,.72);--line:rgba(255,255,255,.22);--cyan:#70f3ff;--gold:#ffe36d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b48;font-family:Tahoma,"Arial",sans-serif;touch-action:none;color:white}
#game{display:block;width:100%;height:100%;image-rendering:pixelated}
.hud{position:fixed;inset:0;pointer-events:none;padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;direction:ltr}
.brand{direction:rtl;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:9px 13px;backdrop-filter:blur(12px);box-shadow:0 8px 24px #0003}
.brand b{font-size:clamp(17px,3vw,25px);letter-spacing:.2px}.brand small{display:block;color:#bdefff;font-size:10px;margin-top:3px}
.stats{display:flex;gap:7px;direction:ltr}.stat{min-width:72px;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:15px;padding:8px 10px;backdrop-filter:blur(12px)}
.stat span{display:block;font-size:10px;color:#c8eaff;letter-spacing:1px}.stat strong{font-size:clamp(17px,3vw,23px);color:var(--gold)}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;direction:ltr;gap:14px}
.pad{display:flex;gap:10px;align-items:center;pointer-events:auto}
.ctrl{border:1px solid #ffffff55;background:linear-gradient(145deg,#ffffff36,#ffffff12);box-shadow:inset 0 1px #ffffff50,0 8px 24px #0003;color:#fff;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none;backdrop-filter:blur(10px);transition:transform .08s,background .08s}
.ctrl:active,.ctrl.down{transform:scale(.94);background:linear-gradient(145deg,#7df4ff80,#a9a0ff55)}
.arrow{width:clamp(56px,10vw,76px);height:clamp(56px,10vw,76px);border-radius:22px;font-size:28px}
.action{width:clamp(68px,12vw,88px);height:clamp(68px,12vw,88px);border-radius:50%;font-weight:900;font-size:13px;letter-spacing:.5px}
.jump{background:linear-gradient(145deg,#ffc94fbb,#ff7a46aa);border-color:#ffe8a0aa}
.tip{align-self:center;background:#09142b99;border:1px solid #ffffff24;border-radius:999px;padding:9px 14px;color:#e7f8ff;font-size:12px;text-align:center;backdrop-filter:blur(8px)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(#0b1647a8,#09112dbb);z-index:5}
.panel{width:min(440px,100%);text-align:center;border:1px solid #ffffff35;border-radius:28px;padding:25px 22px;background:linear-gradient(150deg,#182c62f2,#101932f2);box-shadow:0 25px 80px #0007;backdrop-filter:blur(16px)}
.logo{font-size:clamp(34px,8vw,54px);font-weight:1000;letter-spacing:-1px;color:#ff6cae;text-shadow:3px 4px 0 #a52b72,0 0 30px #ff5eab44}
.panel p{color:#d4e7ff;line-height:1.9;font-size:14px}.start{border:0;border-radius:16px;padding:14px 25px;font-weight:900;font-size:16px;color:#172143;background:linear-gradient(110deg,#79f4ff,#ffe36d);box-shadow:0 8px 25px #69d9ff35;cursor:pointer}
.instructions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:17px 0;color:#c5ddff;font-size:12px}.instructions span{padding:7px 10px;border-radius:10px;background:#ffffff0d;border:1px solid #ffffff15}
@media(max-width:560px){.hud{padding-left:10px;padding-right:10px}.stat{min-width:57px;padding:7px 6px}.brand{padding:8px 10px}.brand small{font-size:9px}.tip{font-size:10px;padding:8px 10px;max-width:34vw}.bottom{gap:6px}.pad{gap:7px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="top">
    <div class="brand"><b>🌟 یاسولیک</b><small>ماجراجویی سرعتی</small></div>
    <div class="stats">
      <div class="stat"><span>RINGS</span><strong id="rings">0</strong></div>
      <div class="stat"><span>SCORE</span><strong id="score">0000</strong></div>
      <div class="stat"><span>LEVEL</span><strong>01</strong></div>
    </div>
  </div>
  <div class="bottom">
    <div class="pad">
      <button class="ctrl arrow" id="left" aria-label="چپ">◀</button>
      <button class="ctrl arrow" id="right" aria-label="راست">▶</button>
    </div>
    <div class="tip">حرکت کن، حلقه جمع کن، بپر! ✨</div>
    <div class="pad">
      <button class="ctrl action jump" id="jump">پرش ⤴</button>
      <button class="ctrl action" id="dash">⚡<br>شتاب</button>
    </div>
  </div>
</div>
<div class="overlay" id="overlay">
 <div class="panel">
   <div class="logo">یاسولیک</div>
   <p>یه ماجراجویی پرسرعت شروع می‌شه!<br>از سکوها بپر، حلقه‌های طلایی رو جمع کن و تا خط پایان برو.</p>
   <div class="instructions"><span>◀ ▶ حرکت</span><span>پرش برای رد شدن از موانع</span><span>⚡ شتاب بیشتر</span></div>
   <button class="start" id="start">شروع بازی 🚀</button>
 </div>
</div>

function makeLevel(){const base=H*.79;platforms=[{x:0,y:base,w:560,h:160},{x:640,y:base-75,w:220,h:20},{x:940,y:base-5,w:260,h:160},{x:1280,y:base-105,w:240,h:20},{x:1600,y:base-25,w:330,h:160},{x:2020,y:base-90,w:260,h:20},{x:2370,y:base,w:450,h:180},{x:2910,y:base-80,w:300,h:20},{x:3300,y:base-10,w:400,h:180},{x:3780,y:base-110,w:260,h:20},{x:4150,y:base,w:600,h:180}];finish=4500;
collectibles=[];for(let x=230;x<4300;x+=135){let p=platforms.find(p=>x>=p.x-20&&x<=p.x+p.w);let y=p?p.y-65-(Math.sin(x*.018)+1)*20:base-120;collectibles.push({x,y,taken:false,phase:Math.random()*6});}
hazards=[{x:490,y:base-24,w:34,h:24},{x:1080,y:base-29,w:36,h:29},{x:1760,y:base-49,w:40,h:24},{x:2480,y:base-24,w:36,h:24},{x:3450,y:base-34,w:40,h:34}];
if(!started){player.x=90;player.y=base-player.h;player.vx=0;player.vy=0;}
}
function groundAt(x,y,oldY,vy){for(const p of platforms){if(x+player.w*.7>p.x&&x+player.w*.3<p.x+p.w&&oldY+player.h<=p.y+8&&y+player.h>=p.y&&vy>=0)return p.y-player.h;}return null;}
function startGame(){started=true;won=false;score=0;rings=0;world=0;collectibles.forEach(c=>c.taken=false);player.x=90;player.vx=0;player.vy=0;player.y=(platforms[0]?.y||H*.79)-player.h;document.getElementById('overlay').style.display='none';}
function press(id,key){const el=document.getElementById(id);const down=e=>{e.preventDefault();keys[key]=true;el.classList.add('down');if(key==='jump'&&player.onGround){player.vy=-700;player.onGround=false;} };const up=e=>{e.preventDefault();keys[key]=false;el.classList.remove('down')};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,up));}
press('left','left');press('right','right');press('jump','jump');press('dash','dash');
document.getElementById('start').addEventListener('click',startGame);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','Shift'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if((e.key==='ArrowUp'||e.key===' '||e.key==='w')&&!keys.jump){keys.jump=true;if(player.onGround){player.vy=-700;player.onGround=false;}}if(e.key==='Shift')keys.dash=true;if(e.key==='Enter'&&!started)startGame();});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(['ArrowUp',' ','w'].includes(e.key))keys.jump=false;if(e.key==='Shift')keys.dash=false;});
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}
function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5ac9f6');g.addColorStop(.62,'#c6f7ff');g.addColorStop(1,'#f5fbff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff6b2';ctx.beginPath();ctx.arc(W*.82,H*.17,38,0,Math.PI*2);ctx.fill();
for(let layer=0;layer<2;layer++){let shift=world*(layer?.22:.1);ctx.fillStyle=layer?'#7adbd0':'#87bde8';for(let i=-1;i<7;i++){let x=i*220-(shift%220);ctx.beginPath();ctx.moveTo(x,H*.72);ctx.quadraticCurveTo(x+90,H*(.35+layer*.08),x+190,H*.72);ctx.lineTo(x+220,H*.72);ctx.fill();}}
for(let i=0;i<10;i++){let x=((i*181-world*.4)%(W+150)+W+150)%(W+150)-60,y=H*(.13+(i%4)*.09);ctx.fillStyle='#ffffff9c';ctx.beginPath();ctx.ellipse(x,y,30,9,0,0,Math.PI*2);ctx.ellipse(x+22,y-5,20,12,0,0,Math.PI*2);ctx.ellipse(x+43,y,25,8,0,0,Math.PI*2);ctx.fill();}}
function drawWorld(){let cam=Math.max(0,player.x-W*.3);world=cam;drawBackground();
for(const p of platforms){let x=p.x-cam;if(x+p.w<0||x>W)continue;ctx.fillStyle='#24b96b';ctx.fillRect(x,p.y,p.w,12);ctx.fillStyle='#b56a3c';ctx.fillRect(x,p.y+12,p.w,p.h);ctx.fillStyle='#d88950';for(let xx=x+8;xx<x+p.w;xx+=34){ctx.fillRect(xx,p.y+23,17,7);ctx.fillRect(xx+10,p.y+45,17,7);}ctx.fillStyle='#fff4d8';ctx.fillRect(x,p.y,p.w,4);}
for(const c of collectibles){if(c.taken)continue;let x=c.x-cam;if(x<-30||x>W+30)continue;let yy=c.y+Math.sin(performance.now()*.004+c.phase)*5;ctx.strokeStyle='#ffb91f';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(x,yy,9,14,.15,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#fff3a3';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x-2,yy,4,9,.15,-1,1);ctx.stroke();}
for(const h of hazards){let x=h.x-cam;if(x<-50||x>W+50)continue;rounded(x,h.y,h.w,h.h,7,'#e8495c','#9c2141');ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x+4,h.y+2);ctx.lineTo(x+12,h.y-9);ctx.lineTo(x+19,h.y+2);ctx.fill();}
let fx=finish-cam;if(fx>-20&&fx<W+20){ctx.fillStyle='#fff';ctx.fillRect(fx,platforms[platforms.length-1].y-135,7,135);ctx.fillStyle='#ff5fa2';ctx.beginPath();ctx.moveTo(fx+7,platforms[platforms.length-1].y-132);ctx.lineTo(fx+70,platforms[platforms.length-1].y-110);ctx.lineTo(fx+7,platforms[platforms.length-1].y-88);ctx.fill();}
drawPlayer(cam);}
function drawPlayer(cam){let x=player.x-cam,y=player.y;if(sprite.complete&&sprite.naturalWidth){ctx.save();if(player.face<0){ctx.translate(x+player.w,y);ctx.scale(-1,1);ctx.drawImage(sprite,0,0,player.w,player.h);}else ctx.drawImage(sprite,x,y,player.w,player.h);ctx.restore();}
else{ctx.fillStyle='#ff69ad';ctx.beginPath();ctx.arc(x+player.w/2,y+player.h/2,player.w/2,0,7);ctx.fill();}
if(keys.dash&&started){ctx.strokeStyle='#fff7a0aa';ctx.lineWidth=4;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(x-10-i*12,y+25+i*9);ctx.lineTo(x-30-i*12,y+25+i*9);ctx.stroke();}}}
function update(dt){if(!started||won)return;let oldY=player.y;const accel=keys.dash?2400:1700,max=keys.dash?570:390;
if(keys.left){player.vx-=accel*dt;player.face=-1;}if(keys.right){player.vx+=accel*dt;player.face=1;}if(!keys.left&&!keys.right)player.vx*=Math.pow(.001,dt);player.vx=Math.max(-max,Math.min(max,player.vx));player.x+=player.vx*dt;player.x=Math.max(0,player.x);
player.vy+=gravity*dt;player.y+=player.vy*dt;player.onGround=false;
let gy=groundAt(player.x,player.y,oldY,player.vy);if(gy!==null){player.y=gy;player.vy=0;player.onGround=true;}
if(player.y>H+180){player.x=Math.max(0,player.x-150);player.y=platforms[0].y-player.h;player.vx=0;player.vy=0;}
for(const c of collectibles){if(!c.taken&&Math.abs(player.x+player.w/2-c.x)<28&&Math.abs(player.y+player.h/2-c.y)<40){c.taken=true;rings++;score+=100;for(let i=0;i<7;i++)particles.push({x:c.x,y:c.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.7)*160,t:.5});}}
for(const h of hazards){if(player.x+player.w-12>h.x&&player.x+12<h.x+h.w&&player.y+player.h>h.y&&player.y<h.y+h.h&&player.inv<=0){if(rings>0)rings=Math.max(0,rings-5);player.vy=-430;player.vx=-player.face*260;player.inv=1;}}
player.inv=Math.max(0,player.inv-dt);score+=Math.max(0,Math.floor(Math.abs(player.vx)*dt*.04));if(player.x>finish){won=true;document.getElementById('overlay').style.display='flex';document.querySelector('.logo').textContent='آفرین! 🎉';document.querySelector('.panel p').innerHTML='تو مرحله‌ی اول رو تموم کردی!<br>امتیاز نهایی: '+score+' · حلقه‌ها: '+rings;document.getElementById('start').textContent='دوباره بازی کن ↻';}
particles=particles.filter(p=>p.t>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;}
document.getElementById('rings').textContent=rings;document.getElementById('score').textContent=String(score).padStart(4,'0');}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.t*2);ctx.fillStyle='#ffe36d';ctx.beginPath();ctx.arc(p.x-world,p.y,3,0,7);ctx.fill();}ctx.globalAlpha=1;}
function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);drawWorld();drawParticles();requestAnimationFrame(frame);}
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script>
</body>
</html>
